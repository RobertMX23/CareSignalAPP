name: Deploy to Firebase (Producción)

# Producción (beta): rama "production", site caresignal-mvp-2026, canal live.
# Solo avanza por fast-forward desde demo (o master). También manual.
on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  # ── 0. CI sobre el mismo commit (reutiliza el verde de QA si existe) ────────
  # Evita repetir el CI: si el mismo commit ya pasó por "Deploy QA (master)" con éxito
  # (la promoción es fast-forward, así que el SHA es idéntico), se reutiliza ese resultado.
  # Si no hay una corrida verde de QA para este SHA, corre el CI completo como antes.
  gate:
    name: Gate (CI ya verde en QA)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.qa.outputs.verified }}
      qa_run_id: ${{ steps.qa.outputs.run_id }}
    steps:
      - id: qa
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          RUN_ID=$(gh api "repos/$REPO/actions/workflows/deploy-qa.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -n "$RUN_ID" ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "CI omitido: el commit $SHA ya está verde en Deploy QA (run $RUN_ID)."
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "Sin corrida verde de QA para $SHA: se ejecuta el CI completo."
          fi

  ci:
    name: CI
    needs: gate
    if: needs.gate.outputs.verified != 'true'
    uses: ./.github/workflows/ci.yml

  # ── 1. Build + deploy Hosting ──────────────────────────────────────────────
  hosting:
    name: Hosting
    needs: [gate, ci]
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build
        env:
          VITE_ACCESS_MODE:           google   # sin efecto hasta B-06
          VITE_FIREBASE_API_KEY:      ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:  caresignal-mvp-2026.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID:   caresignal-mvp-2026
          VITE_FIREBASE_APP_ID:       ${{ secrets.VITE_FIREBASE_APP_ID }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken:              ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARESIGNAL_MVP_2026 }}
          channelId:              live
          projectId:              caresignal-mvp-2026
          target:                 production

  # ── 2. Deploy Firestore rules + indexes ────────────────────────────────────
  firestore:
    name: Firestore Rules & Indexes
    needs: [gate, ci]
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar con Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARESIGNAL_MVP_2026 }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Deploy Firestore rules & indexes
        run: firebase deploy --only firestore --project caresignal-mvp-2026

  # ── 3. Build + deploy Cloud Functions ──────────────────────────────────────
  functions:
    name: Cloud Functions
    needs: [gate, ci]
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-22.04
    # Bloqueante desde B-04: setUserClaims despliega en Node 22 y la política de limpieza de
    # Artifact Registry (gcf-artifacts, 3 días) está aplicada; un fallo aquí debe verse en rojo.
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar con Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARESIGNAL_MVP_2026 }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Install function dependencies
        run: npm ci
        working-directory: functions

      - name: Build functions
        run: npx tsc
        working-directory: functions

      - name: Deploy Cloud Functions
        run: firebase deploy --only functions --project caresignal-mvp-2026

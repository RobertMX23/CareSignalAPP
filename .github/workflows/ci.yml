name: CI

# CI corre en PR hacia master y es invocado (workflow_call) por los workflows de
# deploy (QA, demo, producción), de modo que un deploy nunca corre sin CI verde
# sobre el mismo commit. No se dispara en push para no duplicar ejecuciones.
on:
  pull_request:
    branches: [master]
    # Un PR que solo toca documentación no cambia el código: no gasta minutos.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_call:

# En un PR, una corrida nueva cancela la anterior de la misma rama. Cuando lo invoca un
# deploy (workflow_call) el grupo es único por corrida, así nunca se cancela un deploy.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── 1. Verificación barata: typecheck + unit + build en UN job ────────────────
  # Antes eran 3 jobs con 3 instalaciones (npm ci) y 3 redondeos al minuto.
  verify:
    name: Verify (tsc, vitest, build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: tsc --noEmit
        run: npm run typecheck
      - name: vitest run
        run: npm test
      - name: vite build
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-results
          path: test-results/
          retention-days: 7

  # ── 2. E2E — Chromium ────────────────────────────────────────────────────────
  e2e-chromium:
    name: E2E (Chromium)
    needs: [verify]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('**/package-lock.json') }}-chromium
      - name: Install Playwright (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests (Chromium)
        run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-chromium
          path: test-results/
          retention-days: 7

  # ── 3. Lighthouse CI (E6.5) ──────────────────────────────────────────────────
  lhci:
    name: Lighthouse CI
    needs: [verify]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build for Lighthouse
        run: npm run build
      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.14.x autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7

  # ── 4. Firestore Security Rules (emulador) — B-01 ────────────────────────────
  rules:
    name: Firestore rules (emulador)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Rules tests (firebase emulators:exec)
        run: npm run test:rules

  # ── 5. Cloud Functions en emuladores (Auth + Functions + Firestore) — B-04 ───
  functions:
    name: Functions (emuladores)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install function dependencies
        run: npm ci
        working-directory: functions
      - name: setUserClaims contra emuladores
        run: npm run test:functions

  # ── 6. Auditoría de dependencias de producción (aviso, NO bloquea) ────────────
  audit:
    name: npm audit (aviso)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # Solo avisa: npm audit tiene falsos positivos (ver docs/23-auditoria-dependencias.md)
      # y no debe detener un despliegue. Lee el package-lock.json; no hace falta `npm ci`.
      - name: npm audit --omit=dev --audit-level=high
        run: |
          npm audit --omit=dev --audit-level=high || echo "::warning title=npm audit::Hay vulnerabilidades ALTAS en dependencias de producción. Ver docs/23-auditoria-dependencias.md"

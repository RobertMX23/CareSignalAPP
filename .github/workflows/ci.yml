name: CI

# CI corre en PR hacia master y es invocado (workflow_call) por los workflows de
# deploy (QA, demo, producción), de modo que un deploy nunca corre sin CI verde
# sobre el mismo commit. No se dispara en push para no duplicar ejecuciones.
on:
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  # ── 1. TypeScript ────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: tsc --noEmit
        run: npm run typecheck

  # ── 2. Unit tests (Vitest) ───────────────────────────────────────────────────
  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: vitest run
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-results
          path: test-results/
          retention-days: 7

  # ── 3. Build verification (Vite) ─────────────────────────────────────────────
  build:
    name: Build (vite build)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: vite build
        run: npm run build

  # ── 4. E2E — Chromium ────────────────────────────────────────────────────────
  e2e-chromium:
    name: E2E (Chromium)
    needs: [typecheck, unit, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('**/package-lock.json') }}-chromium
      - name: Install Playwright (chromium)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests (Chromium)
        run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-chromium
          path: test-results/
          retention-days: 7

  # ── 5. Lighthouse CI (E6.5) ──────────────────────────────────────────────────
  lhci:
    name: Lighthouse CI
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Build for Lighthouse
        run: npm run build
      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.14.x autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7

  # ── 6. Firestore Security Rules (emulador) — B-01 ────────────────────────────
  rules:
    name: Firestore rules (emulador)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Rules tests (firebase emulators:exec)
        run: npm run test:rules

  # ── 7. Cloud Functions en emuladores (Auth + Functions + Firestore) — B-04 ───
  functions:
    name: Functions (emuladores)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install function dependencies
        run: npm ci
        working-directory: functions
      - name: setUserClaims contra emuladores
        run: npm run test:functions

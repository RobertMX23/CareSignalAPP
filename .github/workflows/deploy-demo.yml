name: Deploy Demo público (demo)

# Demo público para jurados: rama "demo", site caresignal-demo. Solo avanza por
# fast-forward desde master. Se congela mientras dure la evaluación.
on:
  push:
    branches: [demo]

concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

jobs:
  # Evita repetir el CI: si el mismo commit ya pasó por "Deploy QA (master)" con éxito
  # (la promoción es fast-forward, así que el SHA es idéntico), se reutiliza ese resultado.
  # Si no hay una corrida verde de QA para este SHA, corre el CI completo como antes.
  gate:
    name: Gate (CI ya verde en QA)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.qa.outputs.verified }}
      qa_run_id: ${{ steps.qa.outputs.run_id }}
    steps:
      - id: qa
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          RUN_ID=$(gh api "repos/$REPO/actions/workflows/deploy-qa.yml/runs?head_sha=$SHA&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -n "$RUN_ID" ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "CI omitido: el commit $SHA ya está verde en Deploy QA (run $RUN_ID)."
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "Sin corrida verde de QA para $SHA: se ejecuta el CI completo."
          fi

  ci:
    name: CI
    needs: gate
    if: needs.gate.outputs.verified != 'true'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy site caresignal-demo
    needs: [gate, ci]
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run build
        env:
          VITE_ACCESS_MODE:           guest    # sin efecto hasta B-06
          VITE_FIREBASE_API_KEY:      ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:  caresignal-mvp-2026.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID:   caresignal-mvp-2026
          VITE_FIREBASE_APP_ID:       ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Descargar reportes de Lighthouse (job del CI)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: lighthouse-report
          path: lighthouse-report
          # Si el CI se omitió, el informe sale de la corrida de QA del mismo commit.
          run-id: ${{ needs.gate.outputs.qa_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Generar informe público de Lighthouse (dist/informes)
        run: |
          if ls lighthouse-report/*.report.json >/dev/null 2>&1; then
            node scripts/lighthouse-report.mjs lighthouse-report dist/informes
          else
            echo "Sin reportes de Lighthouse: se omite el informe."
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken:              ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARESIGNAL_MVP_2026 }}
          projectId:              caresignal-mvp-2026
          target:                 demo
          channelId:              live

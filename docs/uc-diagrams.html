<title>CareSignal — Inventario UC & Diagramas UML</title>

<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #4f8ef7;
    --accent2: #7c5cfc;
    --green: #22c55e;
    --yellow: #f59e0b;
    --red: #ef4444;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
    --radius: 8px;
    --font: 'Segoe UI', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f8fafc; --surface: #ffffff; --surface2: #f1f5f9;
      --border: #e2e8f0; --text: #1e293b; --text2: #475569; --text3: #94a3b8;
    }
  }
  :root[data-theme="light"] {
    --bg: #f8fafc; --surface: #ffffff; --surface2: #f1f5f9;
    --border: #e2e8f0; --text: #1e293b; --text2: #475569; --text3: #94a3b8;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 14px; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }
  #root { max-width: 1300px; margin: 0 auto; padding: 1.5rem 1rem; }

  .header { margin-bottom: 1.5rem; }
  .header h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .header p { color: var(--text2); font-size: 0.875rem; margin-top: 0.25rem; }
  .badge-mvp { display: inline-block; background: #1e3a5f; color: #93c5fd; border: 1px solid #3b82f6;
    font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; margin-left: 0.75rem; vertical-align: middle; }

  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; flex-wrap: wrap; }
  .tab-btn { background: none; border: 1px solid transparent; color: var(--text2); padding: 0.4rem 1rem;
    border-radius: var(--radius); cursor: pointer; font-size: 0.875rem; transition: all 0.15s; }
  .tab-btn:hover { background: var(--surface2); color: var(--text); }
  .tab-btn.active { background: var(--surface2); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  /* UC table */
  .filters { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
  .filters label { color: var(--text2); font-size: 0.8rem; }
  .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text2);
    padding: 0.3rem 0.75rem; border-radius: 20px; cursor: pointer; font-size: 0.8rem; transition: all 0.15s; }
  .filter-btn:hover, .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .uc-table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  thead th { background: var(--surface2); color: var(--text2); padding: 0.6rem 0.75rem;
    text-align: left; white-space: nowrap; border-bottom: 1px solid var(--border); font-weight: 600; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; cursor: pointer; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }
  tbody td { padding: 0.55rem 0.75rem; vertical-align: top; }
  .uc-id { font-family: monospace; color: var(--accent2); font-weight: 600; white-space: nowrap; }
  .pri { padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
  .pri-alta { background: #4c1d1d; color: #fca5a5; }
  .pri-media { background: #44320a; color: #fcd34d; }
  .pri-baja { background: #1e3a2a; color: #86efac; }
  .role-badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 0.72rem; margin: 1px;
    background: var(--surface2); border: 1px solid var(--border); color: var(--text2); white-space: nowrap; }
  .role-caregiver { background: #1e3a5f; border-color: #3b82f6; color: #93c5fd; }
  .role-supervisor { background: #3a1e5f; border-color: #a855f7; color: #d8b4fe; }
  .role-admin { background: #1e3a2a; border-color: #22c55e; color: #86efac; }
  .role-system { background: #3a2a1e; border-color: #f59e0b; color: #fcd34d; }

  /* Expand row */
  .uc-expand { background: var(--surface); }
  .uc-expand td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
  .expand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.75rem; }
  .expand-block { background: var(--surface2); border-radius: var(--radius); padding: 0.65rem 0.75rem; border: 1px solid var(--border); }
  .expand-block h4 { color: var(--text2); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.35rem; }
  .expand-block p, .expand-block ul { color: var(--text); font-size: 0.82rem; line-height: 1.5; }
  .expand-block ul { padding-left: 1.1rem; }
  .expand-block li { margin-bottom: 0.2rem; }
  .step-num { display: inline-block; background: var(--accent); color: #fff; border-radius: 50%;
    width: 18px; height: 18px; font-size: 0.7rem; text-align: center; line-height: 18px; margin-right: 4px; flex-shrink: 0; }
  .steps-list { list-style: none; padding: 0; }
  .steps-list li { display: flex; align-items: flex-start; gap: 0.25rem; margin-bottom: 0.3rem; font-size: 0.82rem; }

  /* Diagrams */
  .diagram-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .diag-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text2);
    padding: 0.4rem 1rem; border-radius: var(--radius); cursor: pointer; font-size: 0.82rem; transition: all 0.15s; }
  .diag-btn:hover { background: var(--surface2); color: var(--text); }
  .diag-btn.active { background: var(--surface2); border-color: var(--accent2); color: var(--accent2); font-weight: 600; }
  .diagram-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
  .diagram-card h3 { font-size: 1rem; margin-bottom: 0.35rem; color: var(--text); }
  .diagram-card p { font-size: 0.8rem; color: var(--text2); margin-bottom: 1rem; line-height: 1.5; }
  .mermaid-wrap { background: #fff; border-radius: var(--radius); padding: 1rem; overflow-x: auto; }
  .mermaid-wrap svg { max-width: 100%; height: auto; }
  .loading-diag { color: var(--text2); font-size: 0.875rem; padding: 2rem; text-align: center; }

  @media (max-width: 768px) {
    #root { padding: 1rem 0.75rem; }
    .expand-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

    AR-->>UI: null (no hay alerta activa)

    UI->>T: createSupportAlert(roundId, residentId, actorId)
    T->>T: validar: ronda in_progress && sin alerta activa
    T->>AR: createAlert(severity=yellow, status=open, roundId)
    T->>AU: emit(ALERT_CREATED, actor, ts)
    T-->>UI: {ok:true, alertId}
    UI-->>C: Confirmación visual

    Note over Dash: Dashboard supervisor re-renderiza
    Dash->>AR: getAlerts(status=open)
    AR-->>Dash: [..., nuevaAlerta]
    Dash-->>Dash: Badge contador +1

    alt Alerta ya activa
        C->>UI: Presiona Solicitar Apoyo de nuevo
        UI->>AR: getActiveAlertByRound(roundId)
        AR-->>UI: Alert (ya existe)
        UI-->>C: Botón deshabilitado / mensaje
    end`
  },
  {
    id: "d4",
    title: "UC-16/17 — Motor temporal y overdue automático",
    ucs: "UC-16, UC-17",
    desc: "El motor de tiempo simulado avanza el reloj y genera automáticamente estados overdue y alertas. Determinista y reproducible.",
    code: `sequenceDiagram
    actor A as Admin/Demo
    participant UI as DemoControlPanel
    participant Clock as DemoClock
    participant TE as TemporalEngine
    participant RR as RoundRepository
    participant TR as transitions.ts
    participant AL as AlertRepository
    participant AU as AuditRepository

    A->>UI: Selecciona +1 hora
    UI->>Clock: advance(3600_seconds)
    Clock-->>Clock: simNow = simNow + 3600s
    Clock-->>TE: onTick(simNow)

    TE->>RR: getRounds(status=[scheduled, due])
    RR-->>TE: [Round, Round, ...]

    loop Por cada ronda pendiente
        TE->>TE: ronda.scheduledAt < simNow ?
        alt Vencida
            TE->>TR: markOverdue(roundId, systemActorId)
            TR->>RR: update(status=overdue)
            TR->>AU: emit(ROUND_OVERDUE, system, simNow)
            TR->>AL: getActiveAlertByRound(roundId)
            alt Sin alerta activa
                TR->>AL: createAlert(severity=yellow, status=open)
                TR->>AU: emit(ALERT_CREATED, system, simNow)
            end
        else Aún vigente
            TE->>RR: update(status=due) if within window
        end
    end

    TE-->>UI: {processed: N, overdue: M, alertsCreated: K}
    UI-->>A: Dashboard actualizado`
  }
];

// ─── MERMAID COMPONENT ─────────────────────────────────────────────────────
function MermaidDiagram({ code, id }) {
  const ref = useRef(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    if (!ref.current) return;
    let cancelled = false;

    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      securityLevel: 'loose',
      fontFamily: 'Segoe UI, system-ui, sans-serif',
      fontSize: 13,
      sequence: { actorMargin: 50, width: 160, height: 55, boxTextMargin: 5, noteMargin: 10, messageMargin: 35 }
    });

    const elId = 'mmd-' + id + '-' + Date.now();

    mermaid.render(elId, code).then(({ svg }) => {
      if (!cancelled && ref.current) {
        ref.current.innerHTML = svg;
        setError(null);
      }
    }).catch(e => {
      if (!cancelled) setError(String(e));
    });

    return () => { cancelled = true; };
  }, [code, id]);

  if (error) return React.createElement('div', { style: { color: 'var(--red)', padding: '1rem', fontSize: '0.8rem' } }, 'Error renderizando diagrama: ' + error);
  return React.createElement('div', { ref, className: 'mermaid-wrap' });
}

    ),

        React.createElement('div', { className: 'expand-grid' },
          React.createElement('div', { className: 'expand-block' },
            React.createElement('h4', null, 'Flujo principal'),
            React.createElement('ul', { className: 'steps-list' },
              uc.flujo.map((s, i) =>
                React.createElement('li', { key: i },
                  React.createElement('span', { className: 'step-num' }, i + 1),
                  s)))),

            React.createElement('h4', null, 'Outliers / Guardas'),
            React.createElement('ul', null,
              uc.outliers.map((o, i) => React.createElement('li', { key: i }, o)))),
          React.createElement('div', { className: 'expand-block' },
            React.createElement('h4', null, 'Postcondición'),

// ─── INVENTORY TAB ─────────────────────────────────────────────────────────
function InventoryTab() {
  const [roleFilter, setRoleFilter] = useState('all');
  const [expanded, setExpanded] = useState(null);

  const roles = [
    { key: 'all', label: 'Todos' },
    { key: 'caregiver', label: 'Cuidador' },
    { key: 'supervisor', label: 'Supervisor' },
    { key: 'admin', label: 'Admin' },
    { key: 'system', label: 'Sistema' }
  ];

  const filtered = roleFilter === 'all' ? UCS
    : UCS.filter(uc => uc.actor.split(',').map(a => a.trim()).includes(roleFilter));

  return React.createElement('div', null,
    React.createElement('div', { className: 'filters' },
      React.createElement('span', { style: { color: 'var(--text2)', fontSize: '0.8rem' } }, 'Actor:'),
      roles.map(r =>
        React.createElement('button', {
          key: r.key,
          className: 'filter-btn' + (roleFilter === r.key ? ' active' : ''),
          onClick: () => { setRoleFilter(r.key); setExpanded(null); }
        }, r.label)
      ),
      React.createElement('span', { style: { color: 'var(--text3)', fontSize: '0.75rem', marginLeft: 'auto' } },
        filtered.length + ' casos de uso · click en fila para expandir')
    ),
    React.createElement('div', { className: 'uc-table-wrap' },
      React.createElement('table', null,
        React.createElement('thead', null,
          React.createElement('tr', null,
            ['ID','Nombre','Actor','Prioridad','Disparador','Precondición',''].map(h =>
              React.createElement('th', { key: h }, h)))),
        React.createElement('tbody', null,
          filtered.map(uc =>
            React.createElement(UCRow, {
              key: uc.id, uc,
              expanded: expanded === uc.id,
              onToggle: () => setExpanded(expanded === uc.id ? null : uc.id)
            })
          )
        )
      )
    )
  );
}

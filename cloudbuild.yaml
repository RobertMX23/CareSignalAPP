# cloudbuild.yaml — Pipeline CI/CD para Google Cloud Build
# Construye y despliega: frontend (Firebase Hosting) + backend (Cloud Run)
#
# Variables requeridas en Cloud Build:
#   _PROJECT_ID, _REGION, _SERVICE_NAME, _FIREBASE_PROJECT

steps:

  # ── 1. Instalar dependencias del frontend ────────────────────────────────────
  - name: 'node:20-alpine'
    id: 'install-frontend'
    entrypoint: npm
    args: ['ci']

  # ── 2. Build del frontend (Vite) ─────────────────────────────────────────────
  - name: 'node:20-alpine'
    id: 'build-frontend'
    entrypoint: npm
    args: ['run', 'build']
    env:
      - 'VITE_FIREBASE_API_KEY=$$VITE_FIREBASE_API_KEY'
      - 'VITE_FIREBASE_AUTH_DOMAIN=$$VITE_FIREBASE_AUTH_DOMAIN'
      - 'VITE_FIREBASE_PROJECT_ID=$_PROJECT_ID'
      - 'VITE_FIREBASE_APP_ID=$$VITE_FIREBASE_APP_ID'
      - 'VITE_CLOUD_RUN_URL=https://$_SERVICE_NAME-xxxx-uc.a.run.app'
    waitFor: ['install-frontend']
    secretEnv:
      - 'VITE_FIREBASE_API_KEY'
      - 'VITE_FIREBASE_AUTH_DOMAIN'
      - 'VITE_FIREBASE_APP_ID'

  # ── 3. Build de la imagen Docker del backend ─────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - build
      - '-t'
      - 'gcr.io/$_PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA'
      - 'backend/'
    waitFor: ['-']

  # ── 4. Push de la imagen ─────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - push
      - 'gcr.io/$_PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA'
    waitFor: ['build-backend']

  # ── 5. Deploy a Cloud Run ─────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '$_SERVICE_NAME'
      - '--image=gcr.io/$_PROJECT_ID/$_SERVICE_NAME:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--no-allow-unauthenticated'
      - '--set-env-vars=FIREBASE_PROJECT_ID=$_PROJECT_ID'
      - '--service-account=caresignal-backend@$_PROJECT_ID.iam.gserviceaccount.com'
    waitFor: ['push-backend']

  # ── 6. Deploy frontend a Firebase Hosting ────────────────────────────────────
  - name: 'gcr.io/$_PROJECT_ID/firebase'
    id: 'deploy-frontend'
    args:
      - deploy
      - '--only=hosting'
      - '--project=$_FIREBASE_PROJECT'
    waitFor: ['build-frontend']

availableSecrets:
  secretManager:
    - versionName: 'projects/$_PROJECT_ID/secrets/VITE_FIREBASE_API_KEY/versions/latest'
      env: 'VITE_FIREBASE_API_KEY'
    - versionName: 'projects/$_PROJECT_ID/secrets/VITE_FIREBASE_AUTH_DOMAIN/versions/latest'
      env: 'VITE_FIREBASE_AUTH_DOMAIN'
    - versionName: 'projects/$_PROJECT_ID/secrets/VITE_FIREBASE_APP_ID/versions/latest'
      env: 'VITE_FIREBASE_APP_ID'

options:
  logging: CLOUD_LOGGING_ONLY
